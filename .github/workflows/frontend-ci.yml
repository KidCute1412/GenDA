name: Frontend CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "compose.yaml"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "compose.yaml"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Lint, typecheck, unit test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @genda/web lint

      - name: Typecheck
        run: pnpm --filter @genda/web typecheck

      - name: Unit tests
        run: pnpm --filter @genda/web test

      - name: Production build
        run: pnpm --filter @genda/web build

  e2e:
    name: Playwright critical flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @genda/web exec playwright install --with-deps chromium

      # Đăng nhập là API thật: e2e cần database + backend (profile demo seed sẵn tài khoản demo)
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: v5.0.2

      - name: Start backend
        run: |
          cp .env.example .env
          cp apps/api/.env.example apps/api/.env
          docker compose up --build --wait --wait-timeout 300 database backend

      - name: Run Playwright tests
        run: pnpm --filter @genda/web test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          API_INTERNAL_URL: http://localhost:3001

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Backend logs and cleanup
        if: always()
        run: |
          docker compose logs backend database || true
          docker compose down || true
