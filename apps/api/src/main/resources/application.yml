server:
  port: ${PORT:3001}
  address: 0.0.0.0
  shutdown: graceful
spring:
  application:
    name: genda-api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 0
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  servlet:
    multipart:
      # CV policy allows 2 MB; the slack lets the API answer with a precise TOO_LARGE reason.
      max-file-size: 3MB
      max-request-size: 3MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    jwt-secret: ${AUTH_JWT_SECRET}
    issuer: ${AUTH_JWT_ISSUER:genda-api}
    access-ttl: 5m
    refresh-ttl: 24h
    remembered-refresh-ttl: 7d
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    email-verification:
      otp-ttl: ${AUTH_OTP_TTL:10m}
      resend-cooldown: ${AUTH_OTP_RESEND_COOLDOWN:60s}
      source-rate-window: ${AUTH_OTP_SOURCE_RATE_WINDOW:1h}
      confirmation-source-rate-window: ${AUTH_OTP_CONFIRM_SOURCE_RATE_WINDOW:15m}
      max-attempts: ${AUTH_OTP_MAX_ATTEMPTS:5}
      max-sends-per-source-window: ${AUTH_OTP_MAX_SENDS_PER_SOURCE_WINDOW:10}
      max-confirm-attempts-per-source-window: ${AUTH_OTP_MAX_CONFIRM_ATTEMPTS_PER_SOURCE_WINDOW:20}
      from: ${AUTH_EMAIL_FROM:no-reply@genda.local}
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
    path: /api/v1/openapi
