server:
  port: ${PORT:3001}
  address: 0.0.0.0
  shutdown: graceful
spring:
  application:
    name: genda-api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 0
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
    path: /api/v1/openapi
