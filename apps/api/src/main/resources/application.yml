server:
  port: ${PORT:3001}
  address: 0.0.0.0
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${AUTH_TRUSTED_PROXIES:127\.0\.0\.1|::1}
spring:
  application:
    name: genda-api
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 0
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  servlet:
    multipart:
      # CV policy allows 2 MB; the slack lets the API answer with a precise TOO_LARGE reason.
      max-file-size: 6MB
      max-request-size: 6MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  milestones:
    storage-url: ${SUPABASE_URL:}
    storage-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    bucket: ${DELIVERABLES_BUCKET:milestone-deliverables}
    gemini-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    jwt-secret: ${AUTH_JWT_SECRET}
    issuer: ${AUTH_JWT_ISSUER:genda-api}
    access-ttl: 5m
    refresh-ttl: 24h
    remembered-refresh-ttl: 7d
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
    path: /api/v1/openapi
