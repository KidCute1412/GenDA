name: genda
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    mem_limit: 512m
    build:
      context: ./apps/api
      target: runtime
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      PORT: 3001
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-genda-local-only-jwt-secret-change-before-deploy-2026}
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: Lax
      OPENAPI_ENABLED: "true"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/api/v1/health"]
      interval: 5s
      timeout: 8s
      start_period: 60s
      retries: 30
    develop:
      watch:
        - action: rebuild
          path: ./apps/api/src
        - action: rebuild
          path: ./apps/api/pom.xml
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    env_file:
      - path: ./apps/web/.env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-3001}
      API_INTERNAL_URL: http://backend:3001
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 30
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /workspace/apps/web
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
            - .turbo/
            - package.json
            - next.config.ts
            - "*.tsbuildinfo"
        - action: sync
          path: ./packages/api-client/src
          target: /workspace/packages/api-client/src
          initial_sync: true
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/next.config.ts
        - action: rebuild
          path: ./pnpm-lock.yaml
volumes:
  postgres_data:
