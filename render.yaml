services:
  - type: web
    name: genda-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "10000"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://gen-da-web.lok1412.site
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: None
      - key: DB_POOL_SIZE
        value: "3"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
      - key: OPENAPI_ENABLED
        value: "false"
      - key: SPRING_PROFILES_ACTIVE
        value: "production,demo"
      # Add GEMINI_API_KEY privately in Render when available; startup does not require it.
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DELIVERABLES_BUCKET
        value: milestone-deliverables
