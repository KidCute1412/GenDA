name: genda-auth-test
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_test
      POSTGRES_USER: auth_test
      POSTGRES_PASSWORD: auth_test_only
    ports: ["127.0.0.1:15433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_test -d auth_test"]
      interval: 3s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: ./apps/api
      target: runtime
    environment:
      PORT: 3001
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/auth_test
      SPRING_DATASOURCE_USERNAME: auth_test
      SPRING_DATASOURCE_PASSWORD: auth_test_only
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3010
      AUTH_JWT_SECRET: auth-test-only-secret-at-least-32-bytes
      OPENAPI_ENABLED: "true"
    ports: ["127.0.0.1:3002:3001"]
    depends_on:
      database: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/api/v1/health"]
      interval: 3s
      timeout: 8s
      start_period: 60s
      retries: 40
